---
- name: Check if K3s server is already installed
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: existing_server_unit

- name: Create K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write K3s server configuration
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      node-name: "{{ inventory_hostname }}"
      tls-san:
        - "{{ ansible_host }}"
      write-kubeconfig-mode: "0600"
    owner: root
    group: root
    mode: '0600'
  register: server_config

- name: Download official K3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/install-k3s.sh
    mode: '0755'

- name: Install K3s server only if missing
  ansible.builtin.command:
    cmd: /bin/sh /tmp/install-k3s.sh
    creates: /etc/systemd/system/k3s.service
  environment:
    INSTALL_K3S_EXEC: server
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"

- name: Ensure K3s server service is enabled and running
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Apply changed K3s server configuration on subsequent runs
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when:
    - existing_server_unit.stat.exists
    - server_config.changed

- name: Wait for Kubernetes API readiness
  ansible.builtin.command: /usr/local/bin/k3s kubectl get --raw=/readyz
  register: api_health
  until: api_health.rc == 0
  retries: 36
  delay: 5
  changed_when: false

- name: Read generated cluster join token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: token_file
  no_log: true

- name: Make join token available to agent role
  ansible.builtin.set_fact:
    k3s_join_token: "{{ token_file.content | b64decode | trim }}"
  no_log: true
