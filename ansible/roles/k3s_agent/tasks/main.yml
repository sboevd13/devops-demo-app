---
- name: Check if K3s agent is already installed
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: existing_agent_unit

- name: Create K3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write K3s agent configuration with join token
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      server: "https://{{ hostvars[groups['k3s_server'][0]].ansible_host }}:6443"
      token: "{{ hostvars[groups['k3s_server'][0]].k3s_join_token }}"
      node-name: "{{ inventory_hostname }}"
    owner: root
    group: root
    mode: '0600'
  register: agent_config
  no_log: true

- name: Wait for K3s server API to be reachable from agent
  ansible.builtin.wait_for:
    host: "{{ hostvars[groups['k3s_server'][0]].ansible_host }}"
    port: 6443
    timeout: 120

- name: Download official K3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/install-k3s.sh
    mode: '0755'

- name: Install K3s agent only if missing
  ansible.builtin.command:
    cmd: /bin/sh /tmp/install-k3s.sh
    creates: /etc/systemd/system/k3s-agent.service
  environment:
    INSTALL_K3S_EXEC: agent
    INSTALL_K3S_CHANNEL: "{{ k3s_channel }}"

- name: Ensure K3s agent service is enabled and running
  ansible.builtin.systemd:
    name: k3s-agent
    state: started
    enabled: true
    daemon_reload: true

- name: Apply changed K3s agent configuration on subsequent runs
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
  when:
    - existing_agent_unit.stat.exists
    - agent_config.changed
