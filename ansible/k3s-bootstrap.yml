---
# Run only when building a fresh cluster; site.yml still manages the legacy Compose stack.
- name: Install k3s server on app-1
  hosts: app-1
  become: true
  vars:
    ansible_become_password: "{{ lookup('ansible.builtin.env', 'APP1_BECOME_PASSWORD') }}"
  tasks:
    - name: Disable UFW for k3s networking
      community.general.ufw:
        state: disabled

    - name: Create k3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Configure server network and bundled components
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          node-name: app-1
          node-ip: 192.168.175.130
          flannel-iface: ens33
          tls-san:
            - 192.168.175.130
          disable:
            - traefik
            - servicelb
      notify: Restart k3s server

    - name: Download k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

    - name: Install pinned k3s server
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: v1.36.5+k3s1

    - name: Ensure server is running
      ansible.builtin.service:
        name: k3s
        state: started
        enabled: true

    - name: Read cluster join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: cluster_join_token
      no_log: true

  handlers:
    - name: Restart k3s server
      ansible.builtin.service:
        name: k3s
        state: restarted

- name: Install k3s agent on app-2
  hosts: app-2
  become: true
  vars:
    ansible_become_password: "{{ lookup('ansible.builtin.env', 'APP2_BECOME_PASSWORD') }}"
  tasks:
    - name: Require known working kernel before scheduling PostgreSQL
      ansible.builtin.assert:
        that:
          - ansible_kernel == '7.0.0-38-generic'
        fail_msg: "app-2 must boot Linux 7.0.0-38-generic before PostgreSQL deployment"

    - name: Disable UFW for k3s networking
      community.general.ufw:
        state: disabled

    - name: Create k3s configuration directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Configure agent network
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          node-name: app-2
          node-ip: 192.168.175.133
          flannel-iface: ens33
      notify: Restart k3s agent

    - name: Download k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

    - name: Install pinned k3s agent
      ansible.builtin.command:
        cmd: /tmp/install-k3s.sh
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_VERSION: v1.36.5+k3s1
        K3S_URL: https://192.168.175.130:6443
        K3S_TOKEN: "{{ hostvars['app-1'].cluster_join_token.content | b64decode | trim }}"
      no_log: true

    - name: Ensure agent is running
      ansible.builtin.service:
        name: k3s-agent
        state: started
        enabled: true

  handlers:
    - name: Restart k3s agent
      ansible.builtin.service:
        name: k3s-agent
        state: restarted
