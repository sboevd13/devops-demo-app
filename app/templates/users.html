<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 25px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        .button {
            padding: 10px 16px;
            text-decoration: none;
            border: 1px solid #333;
            background: #eee;
            color: #000;
        }
    </style>
</head>

<body>

<h1>Пользователи</h1>

{% if users %}

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Создан</th>
    </tr>
    </thead>

    <tbody>
    {% for user in users %}
    <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.created_at }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>

{% else %}

<p>Пользователей пока нет.</p>

{% endif %}

<a class="button" href="/">
    Назад
</a>

</body>
</html>
