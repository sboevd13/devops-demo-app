apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - exporters.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    namespace: monitoring
    files:
      - prometheus.yml
      - alerts.yml
  - name: grafana-datasource
    namespace: monitoring
    files:
      - prometheus.yml=datasource.yml
  - name: grafana-dashboard-provider
    namespace: monitoring
    files:
      - dashboards.yml
  - name: grafana-dashboard
    namespace: monitoring
    files:
      - devops-demo.json
