groups:

  - name: devops-demo

    rules:

      - alert: TargetDown
        expr: up{job=~"node|cadvisor|fastapi"} == 0
        for: 1m

        labels:
          severity: critical

        annotations:
          summary: "Monitoring target is down"
          description: "{{ $labels.job }} on {{ $labels.server }} has been unavailable for more than 1 minute."


      - alert: HighCPU
        expr: |
          (
            100
            -
            (
              avg by (server) (
                rate(node_cpu_seconds_total{job="node",mode="idle"}[5m])
              )
              * 100
            )
          ) > 85
        for: 5m

        labels:
          severity: warning

        annotations:
          summary: "High CPU usage"
          description: "CPU usage on {{ $labels.server }} is above 85%."
