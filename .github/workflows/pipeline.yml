name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sboevd13/devops-demo-app


jobs:

  test:
    name: Test application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine

        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: appdb

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://app:ci-password@127.0.0.1:5432/appdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Validate Docker Compose
        env:
          POSTGRES_USER: app
          POSTGRES_DB: appdb
          POSTGRES_PASSWORD: test-password
          APP_IMAGE: ghcr.io/sboevd13/devops-demo-app:test
        run: |
          docker compose config >/dev/null


  build:
    name: Build and publish image
    needs: test

    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    name: Deploy to Kubernetes
    needs: build

    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - linux
      - x64

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check cluster access
        run: kubectl get nodes

      - name: Apply manifests with immutable image tag
        run: |
          cp -R kubernetes/app "$RUNNER_TEMP/app-manifests"
          sed -i "s/newTag: latest/newTag: $GITHUB_SHA/" "$RUNNER_TEMP/app-manifests/kustomization.yaml"
          kubectl apply -k "$RUNNER_TEMP/app-manifests"
          kubectl apply -k kubernetes/monitoring
          kubectl -n devops-demo rollout restart deployment/nginx

      - name: Wait for PostgreSQL and application
        run: |
          kubectl -n devops-demo rollout status statefulset/postgres --timeout=300s
          kubectl -n devops-demo rollout status deployment/devops-demo-app --timeout=180s
          kubectl -n devops-demo rollout status deployment/nginx --timeout=180s
          kubectl -n monitoring rollout status daemonset/node-exporter --timeout=180s
          kubectl -n monitoring rollout status daemonset/cadvisor --timeout=180s
          kubectl -n monitoring rollout status deployment/prometheus --timeout=180s
          kubectl -n monitoring rollout status deployment/grafana --timeout=180s
