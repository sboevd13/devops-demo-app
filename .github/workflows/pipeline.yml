
name: CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sboevd13/devops-demo-app

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://app:ci-password@127.0.0.1:5432/appdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  build:
    name: Build and push image
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to K3s
    needs: build
    runs-on: [self-hosted, linux, x64]
    permissions: {}

    concurrency:
      group: k3s-demo-deploy
      cancel-in-progress: false

    steps:
      - name: Check Kubernetes access
        run: |
          command -v kubectl
          test -r "$HOME/.kube/config"
          kubectl --request-timeout=10s get nodes

      - name: Update FastAPI image
        run: |
          kubectl -n devops-demo set image \
            deployment/devops-demo-app \
            app="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}"

      - name: Wait for rollout
        run: |
          kubectl -n devops-demo rollout status \
            deployment/devops-demo-app --timeout=300s

      - name: Show deployment status
        if: always()
        run: |
          kubectl -n devops-demo get deployment,pods -o wide || true

